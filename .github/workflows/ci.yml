name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.26"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check packages/async-orchestrator packages/strict-tool-router

      - name: Test packages
        run: uv run pytest packages/async-orchestrator/tests packages/strict-tool-router/tests -q
        env:
          LLM_PROVIDER: mock
